server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/machi-service/current/public;
    index index.html;
    client_max_body_size 101m;
    charset utf-8;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/lib/machi-service/uploads/;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
    }

    location = /merchant-admin { return 301 /merchant-admin/; }
    location /merchant-admin/ {
        try_files $uri $uri/ /merchant-admin/index.html;
    }

    location = /platform-admin { return 301 /platform-admin/; }
    location /platform-admin/ {
        try_files $uri $uri/ /platform-admin/index.html;
    }

    location ~* ^/(?:assets|merchant-admin/assets|platform-admin/assets)/.+\.(?:css|js|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
