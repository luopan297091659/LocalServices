# machi-service locations: __PUBLIC_PATH__

location = __PUBLIC_PATH__ {
    return 301 __PUBLIC_PATH__/;
}

location ^~ __PUBLIC_PATH__/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix __PUBLIC_PATH__;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 101m;
}

location ^~ __PUBLIC_PATH__/uploads/ {
    alias /var/lib/machi-service/uploads/;
    add_header X-Content-Type-Options nosniff always;
    expires 7d;
}

location = __PUBLIC_PATH__/merchant-admin {
    return 301 __PUBLIC_PATH__/merchant-admin/;
}

location = __PUBLIC_PATH__/platform-admin {
    return 301 __PUBLIC_PATH__/platform-admin/;
}

location ^~ __PUBLIC_PATH__/assets/ {
    root /opt/machi-service/current/public-root;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location ^~ __PUBLIC_PATH__/merchant-admin/assets/ {
    root /opt/machi-service/current/public-root;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location ^~ __PUBLIC_PATH__/platform-admin/assets/ {
    root /opt/machi-service/current/public-root;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location ^~ __PUBLIC_PATH__/merchant-admin/ {
    root /opt/machi-service/current/public-root;
    try_files $uri $uri/ __PUBLIC_PATH__/merchant-admin/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location ^~ __PUBLIC_PATH__/platform-admin/ {
    root /opt/machi-service/current/public-root;
    try_files $uri $uri/ __PUBLIC_PATH__/platform-admin/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location ^~ __PUBLIC_PATH__/ {
    root /opt/machi-service/current/public-root;
    try_files $uri $uri/ __PUBLIC_PATH__/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
