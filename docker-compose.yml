services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: localservice
      MARIADB_USER: localservice
      MARIADB_PASSWORD: localservice
      MARIADB_ROOT_PASSWORD: localservice-root
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u localservice --password=localservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mariadb_data:
  redis_data:
  minio_data:
